name: test
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['18', '20', '22']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}' }
      # 零依赖，无需 npm install
      # 显式列文件：node --test 的 glob 支持是 Node 22+ 才有的，18/20 不认
      - run: node --test tests/normalize.test.mjs tests/redact.test.mjs tests/sample.test.mjs tests/external-findings.test.mjs
      - name: 冒烟：无数据环境下不能崩
        run: node src/cli.mjs doctor
